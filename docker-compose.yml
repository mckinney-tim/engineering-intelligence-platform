name: engineering-intelligence

services:

  postgres:
    image: postgres:17
    container_name: engineering-demo-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:latest
    container_name: engineering-demo-grafana

    restart: unless-stopped

    depends_on:
      - postgres

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      # Allows the AI Analyst iframe panel (text panel HTML mode).
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
      # Anonymous read-only access for demo recording (no login screen).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer

    ports:
      - "${GRAFANA_PORT}:3000"

    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
    name: engineering-intelligence-demo_postgres_data

  grafana_data:
    name: engineering-intelligence-demo_grafana_data
