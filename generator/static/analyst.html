<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Analyst</title>
<style>
  :root {
    --bg: #181b1f;
    --surface: #22252b;
    --border: #2f3339;
    --text: #ccccdc;
    --text-dim: #8e8e9a;
    --accent: #5794f2;
    --accent-hover: #6ea1f5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 14px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .toolbar .col { display: flex; flex-direction: column; gap: 4px; }

  label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  select, textarea, button {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 3px;
    font-size: 13px;
    font-family: inherit;
  }

  select { padding: 7px 10px; min-width: 230px; }

  .toolbar .col.grow { flex: 1 1 480px; }

  textarea {
    padding: 10px 12px;
    width: 100%;
    max-width: 100%;
    height: 64px;
    min-height: 64px;
    resize: vertical;
    font-size: 14px;
    line-height: 1.4;
  }

  textarea:focus, select:focus { outline: 1px solid var(--accent); }

  button {
    background: var(--accent);
    border: none;
    color: #fff;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 3px;
    cursor: pointer;
    margin-top: 16px;
  }

  button:hover { background: var(--accent-hover); }

  button:disabled { background: var(--border); cursor: wait; }

  .scope {
    margin: 10px 0 0;
    font-size: 12px;
    color: var(--text-dim);
  }

  .scope b { color: var(--text); }

  #answer {
    margin-top: 14px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
    line-height: 1.55;
    max-width: 900px;
  }

  #answer h3 {
    color: #fff;
    font-size: 15px;
    margin: 18px 0 6px;
  }

  #answer h3:first-child { margin-top: 0; }

  #answer ul, #answer ol { margin: 6px 0; padding-left: 22px; }

  #answer li { margin: 3px 0; }

  #answer code {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 12px;
  }

  #answer strong { color: #fff; }

  .cursor {
    display: inline-block;
    width: 7px;
    height: 14px;
    background: var(--accent);
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .error { color: #f2495c; }
</style>
</head>
<body>

<div class="toolbar">
  <div class="col">
    <label for="analysis">Analysis</label>
    <select id="analysis"></select>
  </div>
  <div class="col grow">
    <label for="question">Or ask your own question (overrides the dropdown)</label>
    <textarea id="question" placeholder="e.g. Which single investment would most improve delivery for our strategic customers?"></textarea>
  </div>
  <button id="run">Analyze</button>
</div>

<p class="scope" id="scope">Loading scope&hellip;</p>

<div id="answer"></div>

<script>
(function () {

  const filters = window.location.search;

  const analysisSelect = document.getElementById("analysis");
  const questionBox = document.getElementById("question");
  const runButton = document.getElementById("run");
  const scopeLine = document.getElementById("scope");
  const answer = document.getElementById("answer");

  /* ------------------------------------------------------------
   * Minimal markdown renderer (headings, bold, italics, code,
   * bullet and numbered lists, paragraphs).
   * ------------------------------------------------------------ */

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function inline(s) {
    return s
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>");
  }

  function renderMarkdown(md) {

    const lines = md.split("\n");
    let html = "";
    let list = null;   /* "ul" | "ol" | null */

    function closeList() {
      if (list) { html += "</" + list + ">"; list = null; }
    }

    for (const raw of lines) {

      const line = escapeHtml(raw.trimEnd());

      const h = line.match(/^(#{1,4})\s+(.*)/);
      const ul = line.match(/^[-*]\s+(.*)/);
      const ol = line.match(/^\d+[.)]\s+(.*)/);

      if (h) {
        closeList();
        html += "<h3>" + inline(h[2]) + "</h3>";
      } else if (ul) {
        if (list !== "ul") { closeList(); html += "<ul>"; list = "ul"; }
        html += "<li>" + inline(ul[1]) + "</li>";
      } else if (ol) {
        if (list !== "ol") { closeList(); html += "<ol>"; list = "ol"; }
        html += "<li>" + inline(ol[1]) + "</li>";
      } else if (line.trim() === "") {
        closeList();
      } else {
        closeList();
        html += "<p>" + inline(line) + "</p>";
      }
    }

    closeList();
    return html;
  }

  /* ------------------------------------------------------------
   * Load analyses + scope
   * ------------------------------------------------------------ */

  fetch("/api/v1/analyses")
    .then((r) => r.json())
    .then((items) => {
      for (const item of items) {
        const opt = document.createElement("option");
        opt.value = item.id;
        opt.textContent = item.label;
        analysisSelect.appendChild(opt);
      }
    });

  fetch("/api/v1/scope" + filters)
    .then((r) => r.json())
    .then((s) => {
      scopeLine.innerHTML =
        "Analyzing <b>" + s.issue_count + "</b> engineering issues " +
        "matching the dashboard filters" +
        (s.truncated ? " (capped at " + s.limit + ")" : "") + ".";
    })
    .catch(() => { scopeLine.textContent = "Could not load scope."; });

  /* ------------------------------------------------------------
   * Run analysis (streaming)
   * ------------------------------------------------------------ */

  async function run() {

    const custom = questionBox.value.trim();

    const params = new URLSearchParams(filters);
    if (custom) {
      params.set("question", custom);
    } else {
      params.set("analysis", analysisSelect.value);
    }

    runButton.disabled = true;
    answer.innerHTML = "<span class='cursor'></span>";

    let md = "";

    try {

      const resp = await fetch("/api/v1/analyze?" + params.toString());

      if (!resp.ok) {
        throw new Error("API error " + resp.status);
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        md += decoder.decode(value, { stream: true });
        answer.innerHTML = renderMarkdown(md) + "<span class='cursor'></span>";
        window.scrollTo(0, document.body.scrollHeight);
      }

      answer.innerHTML = renderMarkdown(md);

    } catch (err) {
      answer.innerHTML = "<p class='error'>Analysis failed: " +
        escapeHtml(String(err)) + "</p>";
    } finally {
      runButton.disabled = false;
    }
  }

  runButton.addEventListener("click", run);

  questionBox.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) run();
  });

})();
</script>

</body>
</html>
